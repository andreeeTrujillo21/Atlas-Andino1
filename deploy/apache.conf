<VirtualHost *:80>
    ServerName altiplano3d.andre.net.pe
    Redirect permanent / https://altiplano3d.andre.net.pe/
</VirtualHost>

<VirtualHost *:443>
    ServerName altiplano3d.andre.net.pe

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/altiplano3d.andre.net.pe/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/altiplano3d.andre.net.pe/privkey.pem

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    ProxyPass        / http://127.0.0.1:3002/
    ProxyPassReverse / http://127.0.0.1:3002/

    ErrorLog  ${APACHE_LOG_DIR}/altiplano3d_error.log
    CustomLog ${APACHE_LOG_DIR}/altiplano3d_access.log combined
</VirtualHost>
