server {
    listen 80;
    server_name altiplano3d.andre.net.pe;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name altiplano3d.andre.net.pe;

    ssl_certificate     /etc/letsencrypt/live/altiplano3d.andre.net.pe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/altiplano3d.andre.net.pe/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml model/gltf-binary;
    gzip_min_length 1024;
    gzip_vary on;

    root /var/www/node-apps/altiplano3d/dist;
    index index.html;

    location /api/ {
        proxy_pass         http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|glb|gltf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
